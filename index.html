<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChordPro Renderer</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lora:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fdf6e3;
    --paper: #fffef7;
    --ink: #2c1f0e;
    --ink-light: #6b4f2f;
    --chord: #b84c00;
    --chord-bg: #fff2e6;
    --accent: #c96a00;
    --border: #d4b896;
    --shadow: rgba(44, 31, 14, 0.12);
    --section-bg: #f5ead5;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    background-image: 
      repeating-linear-gradient(0deg, transparent, transparent 27px, rgba(180,150,100,0.08) 27px, rgba(180,150,100,0.08) 28px);
    min-height: 100vh;
    font-family: 'Lora', Georgia, serif;
    color: var(--ink);
  }

  header {
    background: var(--ink);
    color: #fdf6e3;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(0,0,0,0.3);
  }

  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: 1.3rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    flex: 1;
  }

  .header-subtitle {
    font-family: 'Lora', serif;
    font-size: 0.7rem;
    opacity: 0.6;
    font-style: italic;
    margin-top: 1px;
  }

  .btn {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 4px;
    padding: 7px 14px;
    font-family: 'Lora', serif;
    font-size: 0.8rem;
    cursor: pointer;
    transition: background 0.15s;
    white-space: nowrap;
  }
  .btn:hover { background: #a55500; }
  .btn.outline {
    background: transparent;
    border: 1px solid rgba(253,246,227,0.4);
    color: #fdf6e3;
  }
  .btn.outline:hover { background: rgba(255,255,255,0.1); }

  .main {
    max-width: 820px;
    margin: 0 auto;
    padding: 20px 16px 60px;
  }

  /* EDITOR PANEL */
  .editor-panel {
    background: var(--paper);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 2px 16px var(--shadow);
    margin-bottom: 24px;
    overflow: hidden;
    transition: all 0.3s ease;
  }

  .editor-panel.hidden { display: none; }

  .panel-header {
    background: var(--section-bg);
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 0.75rem;
    font-family: 'JetBrains Mono', monospace;
    color: var(--ink-light);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  #editor {
    width: 100%;
    min-height: 240px;
    padding: 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    line-height: 1.7;
    color: var(--ink);
    background: var(--paper);
    border: none;
    resize: vertical;
    outline: none;
  }

  /* SONG DISPLAY */
  .song-display {
    background: var(--paper);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 2px 16px var(--shadow);
    overflow: hidden;
  }

  .song-meta {
    background: var(--ink);
    color: #fdf6e3;
    padding: 24px 24px 20px;
    border-bottom: 3px solid var(--accent);
  }

  .song-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.5rem, 5vw, 2.4rem);
    font-weight: 700;
    line-height: 1.1;
    margin-bottom: 6px;
  }

  .song-artist {
    font-family: 'Lora', serif;
    font-style: italic;
    font-size: 1rem;
    opacity: 0.75;
  }

  .song-key-tempo {
    display: flex;
    gap: 16px;
    margin-top: 12px;
    flex-wrap: wrap;
  }

  .meta-tag {
    background: rgba(255,255,255,0.12);
    border-radius: 3px;
    padding: 3px 8px;
    font-size: 0.72rem;
    font-family: 'JetBrains Mono', monospace;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .song-body {
    padding: 20px 24px 32px;
  }

  /* FONT SIZE CONTROLS */
  .display-controls {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--section-bg);
    flex-wrap: wrap;
  }

  .display-controls span {
    font-size: 0.72rem;
    font-family: 'JetBrains Mono', monospace;
    color: var(--ink-light);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-right: 4px;
  }

  .ctrl-btn {
    background: var(--paper);
    border: 1px solid var(--border);
    border-radius: 4px;
    width: 30px;
    height: 30px;
    font-size: 1rem;
    cursor: pointer;
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.1s;
  }
  .ctrl-btn:hover { background: var(--chord-bg); }

  .transpose-display {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem;
    min-width: 28px;
    text-align: center;
    color: var(--accent);
  }

  /* SECTION */
  .section {
    margin-bottom: 24px;
  }

  .section-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--ink-light);
    background: var(--section-bg);
    border-left: 3px solid var(--accent);
    padding: 3px 8px 3px 10px;
    margin-bottom: 12px;
    border-radius: 0 3px 3px 0;
    display: inline-block;
  }

  /* LINE WITH CHORDS — monospace both rows so character widths match exactly */
  .chord-line {
    margin-bottom: 20px;
    display: block;
    overflow-x: auto;
  }

  .chords-row,
  .lyrics-row {
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-size: var(--lyric-size, 1rem);
    white-space: pre;
    overflow: visible;
  }

  .chords-row {
    color: var(--chord);
    font-weight: 600;
    line-height: 1.3;
  }

  .lyrics-row {
    color: var(--ink);
    font-weight: 400;
    line-height: 1.7;
  }

  .lyric-only {
    font-family: 'JetBrains Mono', monospace;
    font-size: var(--lyric-size, 1rem);
    line-height: 1.7;
    color: var(--ink);
    margin-bottom: 4px;
    white-space: pre-wrap;
  }

  .comment-line {
    font-style: italic;
    color: var(--ink-light);
    font-size: 0.85rem;
    margin-bottom: 8px;
  }

  /* EMPTY STATE */
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--ink-light);
  }
  .empty-state h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1.4rem;
    margin-bottom: 8px;
  }
  .empty-state p { font-style: italic; font-size: 0.9rem; }

  /* RESPONSIVE */
  @media (max-width: 500px) {
    .song-body { padding: 16px 16px 28px; }
    .song-meta { padding: 18px 16px 16px; }
    .display-controls { padding: 10px 16px; }
  }

  /* ANIMATIONS */
  .song-display { animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<header>
  <div style="flex:1">
    <h1>♪ ChordPro</h1>
    <div class="header-subtitle">Lead Sheet Renderer</div>
  </div>
  <button class="btn outline" id="toggleEditorBtn" onclick="toggleEditor()">Edit</button>
  <button class="btn" onclick="loadFile()">Open File</button>
  <input type="file" id="fileInput" accept=".cho,.chordpro,.txt,.crd" style="display:none" onchange="handleFile(event)">
</header>

<div class="main">
  <div class="editor-panel" id="editorPanel">
    <div class="panel-header">
      <span>ChordPro Source</span>
      <button class="btn" onclick="renderSong()" style="padding:4px 12px;font-size:0.75rem;">Render ↓</button>
    </div>
    <textarea id="editor" placeholder="Paste your ChordPro notation here...

Example:
{title: Amazing Grace}
{artist: John Newton}
{key: G}

{start_of_verse: Verse 1}
[G]Amazing [G7]grace, how [C]sweet the [G]sound
That [G]saved a [Em]wretch like [D]me
{end_of_verse}

{start_of_chorus: Chorus}
[G]Praise [C]God, [G]praise [D]God
{end_of_chorus}"></textarea>
  </div>

  <div class="song-display" id="songDisplay">
    <div class="empty-state">
      <h2>No song loaded</h2>
      <p>Open a ChordPro file or paste notation in the editor above</p>
    </div>
  </div>
</div>

<script>
// ---- Transposition ----
const NOTES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const NOTE_ALT = {'Db':'C#','Eb':'D#','Fb':'E','Gb':'F#','Ab':'G#','Bb':'A#','Cb':'B'};

let transpose = 0;
let fontSize = 1; // multiplier

function noteIndex(n) {
  n = NOTE_ALT[n] || n;
  return NOTES.indexOf(n);
}

function transposeChord(chord, semitones) {
  if (semitones === 0) return chord;
  return chord.replace(/[A-G](?:#|b)?/g, match => {
    const idx = noteIndex(match);
    if (idx === -1) return match;
    return NOTES[(idx + semitones + 12) % 12];
  });
}

// ---- Parser ----
function parseLine(line, transposeSemitones) {
  const segments = [];
  const regex = /\[([^\]]+)\]([^\[]*)/g;
  let lastIndex = 0;
  let match;
  let hasChord = false;

  // check if line has any chords
  if (!line.includes('[')) return null;

  while ((match = regex.exec(line)) !== null) {
    if (match.index > lastIndex) {
      segments.push({ chord: null, lyric: line.slice(lastIndex, match.index) });
    }
    const chord = transposeChord(match[1], transposeSemitones);
    const lyric = match[2];
    segments.push({ chord, lyric });
    hasChord = true;
    lastIndex = match.index + match[0].length;
  }
  if (lastIndex < line.length) {
    segments.push({ chord: null, lyric: line.slice(lastIndex) });
  }

  return hasChord ? segments : null;
}

function renderSong() {
  const source = document.getElementById('editor').value;
  const lines = source.split('\n');

  const meta = { title: '', artist: '', key: '', tempo: '', capo: '' };
  const sections = [];
  let currentSection = null;

  const dirRe = /^\{(\w+)(?::\s*(.*))?\}$/;
  const sectionStartRe = /^{start_of_(\w+)(?::\s*(.*))?\}/i;
  const sectionEndRe = /^{end_of_(\w+)}\s*$/i;

  function flushSection() {
    if (currentSection) {
      sections.push(currentSection);
      currentSection = null;
    }
  }

  for (const rawLine of lines) {
    const line = rawLine.trimEnd();

    // Check section directives
    let m;
    if ((m = sectionStartRe.exec(line))) {
      flushSection();
      currentSection = { type: m[1], label: m[2] || m[1], lines: [] };
      continue;
    }
    if ((m = sectionEndRe.exec(line))) {
      flushSection();
      continue;
    }

    // Inline directives
    if ((m = dirRe.exec(line))) {
      const key = m[1].toLowerCase();
      const val = (m[2] || '').trim();
      if (key === 'title' || key === 't') meta.title = val;
      else if (key === 'artist' || key === 'a' || key === 'st') meta.artist = val;
      else if (key === 'key') meta.key = val;
      else if (key === 'tempo') meta.tempo = val;
      else if (key === 'capo') meta.capo = val;
      else if (key === 'comment' || key === 'c') {
        const target = currentSection || (flushSection(), currentSection = { type: 'verse', label: '', lines: [] }, currentSection);
        target.lines.push({ type: 'comment', text: val });
      }
      continue;
    }

    // Content line
    if (!currentSection) {
      currentSection = { type: 'verse', label: '', lines: [] };
    }

    if (line.trim() === '') {
      currentSection.lines.push({ type: 'blank' });
    } else {
      const segments = parseLine(line, transpose);
      if (segments) {
        currentSection.lines.push({ type: 'chord-lyric', segments });
      } else {
        currentSection.lines.push({ type: 'lyric', text: line });
      }
    }
  }
  flushSection();

  // Build HTML
  const display = document.getElementById('songDisplay');
  
  if (!meta.title && sections.length === 0) {
    display.innerHTML = `<div class="empty-state"><h2>Nothing to render</h2><p>Add some ChordPro notation in the editor</p></div>`;
    return;
  }

  const cs = `${(1.0 * fontSize).toFixed(2)}rem`;
  const ls = `${(1.0 * fontSize).toFixed(2)}rem`;

  let html = '';

  // Meta header
  if (meta.title || meta.artist) {
    html += `<div class="song-meta">`;
    if (meta.title) html += `<div class="song-title">${esc(meta.title)}</div>`;
    if (meta.artist) html += `<div class="song-artist">${esc(meta.artist)}</div>`;
    const tags = [];
    if (meta.key) tags.push(`Key: ${esc(meta.key)}`);
    if (meta.capo) tags.push(`Capo ${esc(meta.capo)}`);
    if (meta.tempo) tags.push(`♩ ${esc(meta.tempo)} BPM`);
    if (tags.length) html += `<div class="song-key-tempo">${tags.map(t=>`<span class="meta-tag">${t}</span>`).join('')}</div>`;
    html += `</div>`;
  }

  html += `<div class="display-controls">
    <span>Size</span>
    <button class="ctrl-btn" onclick="adjustFont(-0.1)">A−</button>
    <button class="ctrl-btn" onclick="adjustFont(0.1)">A+</button>
    &nbsp;&nbsp;
    <span>Transpose</span>
    <button class="ctrl-btn" onclick="adjustTranspose(-1)">♭</button>
    <span class="transpose-display" id="transposeDisplay">${transpose >= 0 ? '+' : ''}${transpose}</span>
    <button class="ctrl-btn" onclick="adjustTranspose(1)">♯</button>
  </div>`;

  html += `<div class="song-body" id="songBody" style="--chord-size:${cs};--lyric-size:${ls}">`;

  for (const section of sections) {
    html += `<div class="section">`;
    if (section.label) {
      const prettyLabel = section.label.replace(/_/g, ' ');
      html += `<div class="section-label">${esc(prettyLabel)}</div>`;
    }

    for (const line of section.lines) {
      if (line.type === 'blank') {
        html += `<br>`;
      } else if (line.type === 'comment') {
        html += `<div class="comment-line">— ${esc(line.text)}</div>`;
      } else if (line.type === 'lyric') {
        html += `<div class="lyric-only">${esc(line.text)}</div>`;
      } else if (line.type === 'chord-lyric') {
        // Both rows use monospace. For each segment we figure out how many
        // characters wide it needs to be (max of chord length and lyric length)
        // then pad both to that width so columns stay aligned.
        let chordStr = '';
        let lyricStr = '';

        for (const seg of line.segments) {
          const chord = seg.chord || '';
          const lyric = seg.lyric || '';

          if (!chord) {
            // No chord: just emit the lyric text, leave chord row blank
            chordStr += ' '.repeat(lyric.length);
            lyricStr += lyric;
          } else {
            // Need at least chord.length + 1 space of separation
            const colWidth = Math.max(chord.length + 1, lyric.length);
            chordStr += chord.padEnd(colWidth);
            lyricStr += lyric.padEnd(colWidth);
          }
        }

        // Trim trailing spaces but keep rows same length for display
        html += `<div class="chord-line">`;
        html += `<div class="chords-row">${esc(chordStr.trimEnd())}</div>`;
        if (lyricStr.trim()) {
          html += `<div class="lyrics-row">${esc(lyricStr.trimEnd())}</div>`;
        }
        html += `</div>`;
      }
    }

    html += `</div>`;
  }

  html += `</div>`;

  display.innerHTML = html;
  display.style.animation = 'none';
  display.offsetHeight;
  display.style.animation = 'fadeIn 0.3s ease';
}

function esc(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function adjustFont(delta) {
  fontSize = Math.max(0.6, Math.min(1.8, fontSize + delta));
  const body = document.getElementById('songBody');
  if (body) {
    const s = `${(1.0 * fontSize).toFixed(2)}rem`;
    body.style.setProperty('--lyric-size', s);
  }
}

function adjustTranspose(delta) {
  transpose = (transpose + delta + 12) % 12;
  if (transpose > 6) transpose -= 12;
  document.getElementById('transposeDisplay').textContent = (transpose >= 0 ? '+' : '') + transpose;
  renderSong();
}

function toggleEditor() {
  const panel = document.getElementById('editorPanel');
  const btn = document.getElementById('toggleEditorBtn');
  panel.classList.toggle('hidden');
  btn.textContent = panel.classList.contains('hidden') ? 'Edit' : 'Hide';
}

function loadFile() {
  document.getElementById('fileInput').click();
}

function handleFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    document.getElementById('editor').value = ev.target.result;
    const panel = document.getElementById('editorPanel');
    if (panel.classList.contains('hidden')) panel.classList.remove('hidden');
    renderSong();
  };
  reader.readAsText(file);
  e.target.value = '';
}

// Listen for input and auto-render with debounce
let debounceTimer;
document.getElementById('editor').addEventListener('input', () => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(renderSong, 600);
});

// Load demo on start
document.getElementById('editor').value = `{title: Amazing Grace}
{artist: John Newton}
{key: G}

{start_of_verse: Verse 1}
[G]Amazing [G7]grace, how [C]sweet the [G]sound
That [G]saved a [Em]wretch like [D7]me
[G]I once was [G7]lost, but [C]now am [G]found
Was [G]blind, but [Em]now I [D7]see[G]
{end_of_verse}

{start_of_verse: Verse 2}
[G]'Twas grace that [G7]taught my [C]heart to [G]fear
And [G]grace my [Em]fears re[D7]lieved
[G]How precious [G7]did that [C]grace ap[G]pear
The [G]hour I [Em]first be[D7]lieved[G]
{end_of_verse}

{start_of_chorus: Chorus}
[G]Praise [C]God, [G]praise [D]God
[G]Praise [Em]God from [D]whom all [G]blessings [C]flow
[G]Praise [Em]God, all [D7]creatures [G]here be[C]low
{end_of_chorus}`;

renderSong();
</script>
</body>
</html>
